<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lennon Hub - Luxury Gold Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #080603;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(217, 119, 6, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(251, 191, 36, 0.15) 0%, transparent 50%);
        }

        /* Ambient Gold Blobs */
        .ambient-glow {
            position: fixed;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 { top: -70px; left: -70px; background: #F59E0B; }
        .glow-2 { bottom: -70px; right: -70px; background: #D97706; }

        /* Màn Hình Từ Chối Truy Cập */
        .denied-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            animation: fadeIn 0.4s ease-out;
        }

        .denied-title {
            color: #EF4444;
            font-size: 21px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        .denied-desc {
            color: #A8A29E;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .denied-action {
            color: #FBBF24;
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.6;
        }

        /* Khung Chính Hoàng Gia Gold */
        .hub-card {
            width: 100%;
            max-width: 410px;
            background: linear-gradient(180deg, rgba(22, 17, 10, 0.97) 0%, rgba(12, 9, 5, 0.99) 100%);
            border-radius: 28px;
            padding: 24px 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.9), 0 0 40px rgba(245, 158, 11, 0.22);
            animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Viền Vàng Gold Lấp Lánh Chuyển Động */
        .hub-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, #FFE066, #F59E0B, #B45309, #FFFBEB, #D97706, #FBBF24);
            border-radius: 30px;
            z-index: -1;
            opacity: 0.95;
            background-size: 300% 300%;
            animation: gradientGold 5s ease infinite;
        }

        @keyframes gradientGold {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Logo Vương Miện Gold */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }
        .logo-box {
            width: 66px;
            height: 66px;
            background: linear-gradient(145deg, #2A2011, #161007);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(251, 191, 36, 0.55);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.45), inset 0 0 15px rgba(251, 191, 36, 0.25);
            font-size: 32px;
            animation: floatIcon 3.5s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Tiêu Đề Lennon Hub */
        .hub-header {
            text-align: center;
            margin-bottom: 18px;
        }
        .hub-title {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFFBEB 0%, #FDE68A 40%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .hub-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #FBBF24;
            margin-top: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Hàng Trạng Thái */
        .status-row {
            background: rgba(30, 23, 13, 0.75);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 14px;
            padding: 11px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .status-label {
            font-size: 12.5px;
            color: #D6D3D1;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #FBBF24;
            border: 1px solid rgba(245, 158, 11, 0.45);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            background: #FBBF24;
            border-radius: 50%;
            box-shadow: 0 0 10px #F59E0B;
            animation: pulseDot 1.5s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        /* Grid 2 Cột */
        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .info-card {
            background: rgba(30, 23, 13, 0.75);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }
        .info-card .label { color: #A8A29E; font-weight: 600; }
        .info-card .val {
            font-weight: 800;
            color: #FEF3C7;
        }
        .info-card .val.highlight {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #1C1917;
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 900;
        }

        /* Khung Key Vàng Gold */
        .key-section {
            background: rgba(26, 20, 11, 0.88);
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .key-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .key-title {
            font-size: 12px;
            font-weight: 800;
            color: #FEF3C7;
            letter-spacing: 0.5px;
        }
        .key-badge-status {
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(168, 162, 158, 0.15);
            color: #A8A29E;
            border: 1px solid rgba(168, 162, 158, 0.3);
            transition: all 0.3s;
        }
        .key-badge-status.active {
            background: rgba(245, 158, 11, 0.2);
            color: #FDE68A;
            border-color: rgba(245, 158, 11, 0.5);
        }

        /* Hộp Hiển Thị Key */
        .key-display-box {
            background: #0E0A05;
            border: 1.5px solid #292013;
            border-radius: 12px;
            padding: 12px 14px;
            text-align: center;
            margin-bottom: 12px;
            transition: all 0.35s ease;
        }
        .key-display-box.unlocked {
            border-color: #F59E0B;
            background: #1C1409;
            box-shadow: 0 0 22px rgba(245, 158, 11, 0.35);
        }
        .key-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15.5px;
            font-weight: 800;
            color: #78716C;
            letter-spacing: 1.5px;
            transition: all 0.3s;
            word-break: break-all;
        }
        .key-text.unlocked {
            color: #FDE68A;
            text-shadow: 0 0 14px rgba(245, 158, 11, 0.7);
        }

        /* Nút Vàng Gold Lấp Lánh */
        .btn-action {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #FDE68A 0%, #F59E0B 50%, #D97706 100%);
            color: #1C1917;
            box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45);
        }
        .btn-action:active {
            transform: scale(0.97);
        }
        .btn-action.copied {
            background: linear-gradient(90deg, #10B981 0%, #059669 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.45);
        }

        /* Khung Script */
        .script-section {
            background: rgba(26, 20, 11, 0.88);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }
        .script-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .script-title {
            font-size: 11.5px;
            font-weight: 800;
            color: #FDE68A;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-copy-script {
            background: none;
            border: none;
            color: #FBBF24;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            padding: 2px 4px;
            transition: color 0.2s;
        }
        .btn-copy-script:hover { color: #FFE066; }

        .script-code-box {
            background: #0E0A05;
            border: 1px solid #292013;
            border-radius: 10px;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #E7E5E4;
            line-height: 1.45;
            word-break: break-all;
            user-select: all;
        }
        .script-code-box .keyword { color: #F43F5E; }
        .script-code-box .string { color: #FBBF24; }

        /* Nút Bật Tắt SFX */
        .sfx-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px 12px 4px;
        }
        .sfx-label {
            font-size: 11.5px;
            color: #A8A29E;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sfx-toggle-btn {
            background: rgba(30, 23, 13, 0.8);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #FEF3C7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .sfx-toggle-btn.active {
            border-color: #F59E0B;
            color: #FDE68A;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #78716C;
            font-weight: 600;
        }

        /* Toast Thông Báo Gold */
        .toast-notification {
            position: fixed;
            bottom: -90px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #241A0B, #140E05);
            border: 1.5px solid #F59E0B;
            color: #FFFBEB;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 35px rgba(245, 158, 11, 0.4);
            z-index: 100;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-notification.show {
            bottom: 24px;
        }
    </style>
</head>
